<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="640" viewBox="0 0 1600 640" font-family="'Segoe UI', Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1F3A68"/>
    </marker>
  </defs>
  <rect width="1600" height="640" fill="#FFFFFF"/>

  <text x="40" y="48" font-size="28" font-weight="700" fill="#1F3A68">Feasible today, viable at scale</text>
  <text x="40" y="76" font-size="16" fill="#55627A">The four questions every evaluator asks — and our answer to each</text>

  <!-- pillar 1: technical -->
  <rect x="40" y="100" width="365" height="300" rx="18" fill="#EDF5FE" stroke="#4A90E2" stroke-width="2"/>
  <circle cx="92" cy="152" r="32" fill="#1E6FD9"/>
  <svg x="72" y="132" width="40" height="40" viewBox="0 0 24 24" fill="#FFFFFF"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/></svg>
  <text x="138" y="146" font-size="14" font-weight="700" fill="#1E6FD9" letter-spacing="1">TECHNICAL</text>
  <text x="138" y="172" font-size="22" font-weight="700" fill="#14233C">Built and tested</text>
  <text x="66" y="226" font-size="17" fill="#243247">• App, server and dashboard</text>
  <text x="82" y="250" font-size="17" fill="#243247">work end to end</text>
  <text x="66" y="284" font-size="17" fill="#243247">• 31 real pack scans</text>
  <text x="66" y="318" font-size="17" fill="#243247">• 430 automated tests</text>
  <rect x="66" y="340" width="120" height="38" rx="19" fill="#1F3A68"/>
  <text x="126" y="365" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">TRL 4</text>

  <!-- pillar 2: economic -->
  <rect x="425" y="100" width="365" height="300" rx="18" fill="#E6F6F0" stroke="#2BA37A" stroke-width="2"/>
  <circle cx="477" cy="152" r="32" fill="#138A63"/>
  <text x="477" y="166" font-size="36" font-weight="700" fill="#FFFFFF" text-anchor="middle">₹</text>
  <text x="523" y="146" font-size="14" font-weight="700" fill="#138A63" letter-spacing="1">ECONOMIC</text>
  <text x="523" y="172" font-size="22" font-weight="700" fill="#14233C">Low cost to run</text>
  <text x="451" y="226" font-size="17" fill="#243247">• Any normal Android phone</text>
  <text x="451" y="260" font-size="17" fill="#243247">• Label reading happens on the</text>
  <text x="467" y="284" font-size="17" fill="#243247">phone — no fee per scan</text>
  <text x="451" y="318" font-size="17" fill="#243247">• Free, open-source tools</text>
  <text x="451" y="352" font-size="17" fill="#243247">• One small server to host</text>

  <!-- pillar 3: operational -->
  <rect x="810" y="100" width="365" height="300" rx="18" fill="#FFF2E0" stroke="#F0A030" stroke-width="2"/>
  <circle cx="862" cy="152" r="32" fill="#E8871E"/>
  <svg x="842" y="132" width="40" height="40" viewBox="0 0 24 24" fill="#FFFFFF"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
  <text x="908" y="146" font-size="14" font-weight="700" fill="#C2410C" letter-spacing="1">OPERATIONAL</text>
  <text x="908" y="172" font-size="22" font-weight="700" fill="#14233C">Easy to adopt</text>
  <text x="836" y="226" font-size="17" fill="#243247">• One photo per check,</text>
  <text x="852" y="250" font-size="17" fill="#243247">details filled automatically</text>
  <text x="836" y="284" font-size="17" fill="#243247">• Follows the existing process:</text>
  <text x="852" y="308" font-size="17" fill="#243247">inspector files, Controller</text>
  <text x="852" y="332" font-size="17" fill="#243247">decides</text>
  <text x="836" y="366" font-size="17" fill="#243247">• Evidence is ready for a case</text>

  <!-- pillar 4: scalable -->
  <rect x="1195" y="100" width="365" height="300" rx="18" fill="#F0EEFE" stroke="#7B6CF0" stroke-width="2"/>
  <circle cx="1247" cy="152" r="32" fill="#5B4BD6"/>
  <svg x="1227" y="132" width="40" height="40" viewBox="0 0 24 24" fill="#FFFFFF"><path d="M16 6l2.29 2.29-4.88 4.88-4-4L2 16.59 3.41 18l6-6 4 4 6.3-6.29L22 12V6z"/></svg>
  <text x="1293" y="146" font-size="14" font-weight="700" fill="#5B4BD6" letter-spacing="1">VIABLE</text>
  <text x="1293" y="172" font-size="22" font-weight="700" fill="#14233C">Grows with the need</text>
  <text x="1221" y="226" font-size="17" fill="#243247">• Product data already exists</text>
  <text x="1237" y="250" font-size="17" fill="#243247">(GS1 India's DataKart)</text>
  <text x="1221" y="284" font-size="17" fill="#243247">• Each rule stored with the</text>
  <text x="1237" y="308" font-size="17" fill="#243247">law it comes from</text>
  <text x="1221" y="342" font-size="17" fill="#243247">• Runs on any cloud,</text>
  <text x="1237" y="366" font-size="17" fill="#243247">government or commercial</text>

  <!-- growth path -->
  <text x="40" y="452" font-size="16" font-weight="700" fill="#1F3A68" letter-spacing="0.6">HOW IT GROWS</text>
  <line x1="40" y1="532" x2="1540" y2="532" stroke="#C9D3E3" stroke-width="6" stroke-linecap="round"/>
  <line x1="40" y1="532" x2="1552" y2="532" stroke="#1F3A68" stroke-width="3" marker-end="url(#a)"/>

  <g font-size="16" text-anchor="middle">
    <circle cx="140" cy="532" r="22" fill="#138A63" stroke="#FFFFFF" stroke-width="4"/>
    <text x="140" y="538" font-size="15" font-weight="700" fill="#FFFFFF">1</text>
    <text x="140" y="578" font-weight="700" fill="#14233C">Prototype</text>
    <text x="140" y="600" fill="#55627A">built and tested</text>
    <rect x="80" y="468" width="120" height="30" rx="15" fill="#138A63"/>
    <text x="140" y="489" font-size="14" font-weight="700" fill="#FFFFFF">WE ARE HERE</text>

    <circle cx="420" cy="532" r="22" fill="#1E6FD9" stroke="#FFFFFF" stroke-width="4"/>
    <text x="420" y="538" font-size="15" font-weight="700" fill="#FFFFFF">2</text>
    <text x="420" y="578" font-weight="700" fill="#14233C">Real product data</text>
    <text x="420" y="600" fill="#55627A">from GS1 DataKart</text>

    <circle cx="700" cy="532" r="22" fill="#1E6FD9" stroke="#FFFFFF" stroke-width="4"/>
    <text x="700" y="538" font-size="15" font-weight="700" fill="#FFFFFF">3</text>
    <text x="700" y="578" font-weight="700" fill="#14233C">Pilot</text>
    <text x="700" y="600" fill="#55627A">one Legal Metrology office</text>

    <circle cx="980" cy="532" r="22" fill="#5B4BD6" stroke="#FFFFFF" stroke-width="4"/>
    <text x="980" y="538" font-size="15" font-weight="700" fill="#FFFFFF">4</text>
    <text x="980" y="578" font-weight="700" fill="#14233C">District</text>
    <text x="980" y="600" fill="#55627A">inspectors and consumers</text>

    <circle cx="1260" cy="532" r="22" fill="#5B4BD6" stroke="#FFFFFF" stroke-width="4"/>
    <text x="1260" y="538" font-size="15" font-weight="700" fill="#FFFFFF">5</text>
    <text x="1260" y="578" font-weight="700" fill="#14233C">State, then national</text>
    <text x="1260" y="600" fill="#55627A">same checks, more data</text>
  </g>
</svg>
