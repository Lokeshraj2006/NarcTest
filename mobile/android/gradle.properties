# jdk.net.unixdomain.tmpdir must point at a space-free path. JDK 17+ builds
# Gradle's internal pipes on AF_UNIX sockets, and a space in the default
# %TEMP% path (C:\Users\LOKESHRAJ M\...) makes connect() fail with
# "Invalid argument", surfacing as "Unable to establish loopback connection".
org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=2G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError -Djdk.net.unixdomain.tmpdir=C:\\jtmp
# Fail fast on stalled downloads instead of blocking forever. This machine
# has shown repeated mid-transfer stalls against Google's CDN (connection
# stays ESTABLISHED but stops delivering bytes), which without these
# timeouts hangs the build indefinitely rather than erroring out.
systemProp.org.gradle.internal.http.connectionTimeout=60000
systemProp.org.gradle.internal.http.socketTimeout=60000
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
