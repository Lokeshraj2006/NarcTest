name: labelguard_mobile
description: "FieldProof — Digital companion for field drug testing (SIH26231)"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  provider: ^6.1.2

  # Networking & HTTP
  dio: ^5.7.0

  # Secure Storage & JWT
  flutter_secure_storage: ^9.2.2


  # Hardware & Location
  camera: ^0.11.0+2
  geolocator: ^13.0.1
  path_provider: ^2.1.4
  path: ^1.9.0

  # Time Sync & Cryptographic Hashing
  ntp: ^2.0.0
  crypto: ^3.0.3

  # UI & Utilities
  intl: ^0.19.0
  cupertino_icons: ^1.0.8

  # Map view (Leaflet-equivalent, same OpenStreetMap tiles as the dashboard)
  flutter_map: ^8.1.1
  latlong2: ^0.9.1
  url_launcher: ^6.3.1

  # File open (for downloaded legal-notice PDFs)
  open_filex: ^4.5.0
  # Image gallery fallback (when camera isn't available on the demo device)
  image_picker: ^1.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
